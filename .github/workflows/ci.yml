name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install wxWidgets and Meson (macOS)
        if: runner.os == 'macOS'
        run: brew install wxwidgets meson ninja

      - name: Install wxWidgets and Meson (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwxgtk3.2-dev meson ninja-build

      - name: Setup
        run: meson setup build -Dwerror=true

      - name: Compile
        run: meson compile -C build

      - name: Verify binary was produced
        run: test -e build/ah

      - name: Test
        run: meson test -C build --print-errorlogs
